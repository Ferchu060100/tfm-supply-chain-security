
name: Container CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Permisos mínimos por defecto
permissions:
  contents: read

# Evita ejecuciones redundantes
concurrency:
  group: container-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # JOB 1: VALIDACIÓN DE PULL REQUEST
  # ==========================================
  validate-build:
    name: Validate Docker Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate application syntax
        run: python -m compileall -q src

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: tfm-api:pr-${{ github.event.pull_request.number }}

  # ==========================================
  # JOB 2: BUILD Y PUBLICACIÓN EN GHCR
  # ==========================================
  publish-image:
    name: Build and Publish to GHCR

    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ==========================================
      # INSTALACIÓN DE COSIGN
      # ==========================================

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Verify Cosign installation
        run: cosign version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0

        with:
          context: .
          file: ./Dockerfile

          push: true

          tags: |
            ghcr.io/ferchu060100/tfm-supply-chain-security:sha-${{ github.sha }}
            ghcr.io/ferchu060100/tfm-supply-chain-security:latest

          labels: |
            org.opencontainers.image.source=https://github.com/Ferchu060100/tfm-supply-chain-security
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=tfm-supply-chain-security

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========================================
      # FIRMA CRIPTOGRAFICA DE IMAGEN CON COSIGN
      # ==========================================

      - name: Sign Docker image with Cosign (Keyless)
        env:
          IMAGE: ghcr.io/ferchu060100/tfm-supply-chain-security
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          cosign sign \
          --new-bundle-format=false \
          --use-signing-config=false \
          --yes \
          "${IMAGE}@${DIGEST}"



      # ==========================================
      # GENERACIÓN DE SBOM CON SYFT
      # ==========================================

      - name: Generate CycloneDX SBOM
        id: sbom
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/ferchu060100/tfm-supply-chain-security@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          syft-version: v1.57.2
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      # ==========================================
      # VALIDACIÓN DEL SBOM
      # ==========================================

      - name: Validate SBOM
        id: validate-sbom
        shell: bash
        run: |
          set -euo pipefail

          test -s sbom.cdx.json

          jq -e '
            .bomFormat == "CycloneDX" and
            (.components | type == "array")
          ' sbom.cdx.json > /dev/null

          COMPONENTS=$(jq '.components | length' sbom.cdx.json)
          SBOM_SHA256=$(sha256sum sbom.cdx.json | awk '{print $1}')

          {
            echo "## SBOM CycloneDX"
            echo ""
            echo "- Format: CycloneDX JSON"
            echo "- Components: ${COMPONENTS}"
            echo "- SHA-256: ${SBOM_SHA256}"
          } >> "$GITHUB_STEP_SUMMARY"

      # ==========================================
      # ALMACENAMIENTO DEL SBOM
      # ==========================================

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30


      # ==========================================
      # GENERACIÓN DE PROVENANCE SLSA
      # ==========================================

      - name: Generate SLSA provenance attestation
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/ferchu060100/tfm-supply-chain-security
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
          show-summary: true

      # ==========================================
      # ATESTACIÓN CRIPTOGRÁFICA DEL SBOM
      # ==========================================

      - name: Generate SBOM attestation
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/ferchu060100/tfm-supply-chain-security
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
          create-storage-record: false
          show-summary: true


      - name: Publish image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Docker Image Published"
            echo ""
            echo "Repository: ghcr.io/ferchu060100/tfm-supply-chain-security"
            echo ""
            echo "Commit: ${GITHUB_SHA}"
            echo ""
            echo "Digest: ${IMAGE_DIGEST}"
            echo ""
            echo "Immutable reference:"
            echo "ghcr.io/ferchu060100/tfm-supply-chain-security@${IMAGE_DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
