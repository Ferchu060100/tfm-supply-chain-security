
name: Container CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Permisos mínimos por defecto
permissions:
  contents: read

# Evita ejecuciones redundantes
concurrency:
  group: container-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # JOB 1: VALIDACIÓN DE PULL REQUEST
  # ==========================================
  validate-build:
    name: Validate Docker Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate application syntax
        run: python -m compileall -q src

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: tfm-api:pr-${{ github.event.pull_request.number }}

  # ==========================================
  # JOB 2: BUILD Y PUBLICACIÓN EN GHCR
  # ==========================================
  publish-image:
    name: Build and Publish to GHCR

    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0

        with:
          context: .
          file: ./Dockerfile

          push: true

          tags: |
            ghcr.io/ferchu060100/tfm-supply-chain-security:sha-${{ github.sha }}
            ghcr.io/ferchu060100/tfm-supply-chain-security:latest

          labels: |
            org.opencontainers.image.source=https://github.com/Ferchu060100/tfm-supply-chain-security
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=tfm-supply-chain-security

          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Docker Image Published"
            echo ""
            echo "Repository: ghcr.io/ferchu060100/tfm-supply-chain-security"
            echo ""
            echo "Commit: ${GITHUB_SHA}"
            echo ""
            echo "Digest: ${IMAGE_DIGEST}"
            echo ""
            echo "Immutable reference:"
            echo "ghcr.io/ferchu060100/tfm-supply-chain-security@${IMAGE_DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
